<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Healthcare Timesheet Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #e8f0ff 0%, #f6f8fc 45%, #f3f6fb 100%);
            min-height: 100vh;
        }
        .brand-pill {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 0.35rem 0.85rem;
            font-size: 0.78rem;
        }
        .main-nav {
            background: linear-gradient(120deg, #0b3fa8 0%, #2463eb 55%, #4f7cff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(12, 71, 160, 0.08);
            border-radius: 1rem;
            box-shadow: 0 14px 36px rgba(16, 40, 90, 0.08);
        }
        .bot-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1fd67d;
            display: inline-block;
            margin-right: 0.35rem;
            box-shadow: 0 0 12px rgba(31, 214, 125, 0.8);
        }
        .drop-zone {
            border: 2px dashed #8aa5e8;
            border-radius: 0.9rem;
            background: linear-gradient(180deg, #f8fbff 0%, #edf3ff 100%);
            transition: all 0.18s ease;
            cursor: pointer;
        }
        .drop-zone:hover {
            border-color: #4f7cff;
            background: linear-gradient(180deg, #f3f8ff 0%, #e5eeff 100%);
        }
        .drop-zone.active {
            border-color: #2a63e6;
            background: linear-gradient(180deg, #ecf4ff 0%, #dce9ff 100%);
            box-shadow: 0 0 0 0.2rem rgba(43, 101, 230, 0.13);
        }
        .hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark main-nav mb-4 shadow-sm">
    <div class="container">
        <div class="d-flex align-items-center gap-2 text-white">
            <span class="navbar-brand mb-0 h4">CareOps Timesheet AI</span>
            <span class="brand-pill">SaaS Assistant</span>
        </div>
    </div>
</nav>
<main class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
